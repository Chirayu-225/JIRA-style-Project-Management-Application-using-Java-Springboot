# Every ${VAR:default} reads an environment variable, falling back to the default for local dev.
# In production (Render) you set these in the dashboard. Never commit real secrets.

server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful
  forward-headers-strategy: framework   # trust X-Forwarded-* from Render's load balancer

spring:
  application:
    name: issue-tracker-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/issuetracker}
    username: ${DB_USERNAME:issuetracker}
    password: ${DB_PASSWORD:issuetracker}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # small: free Postgres tiers limit connections
      connection-timeout: 20000
  jpa:
    open-in-view: false         # no lazy loading in controllers: forces clean service boundaries
    hibernate:
      ddl-auto: none            # Flyway owns the schema, Hibernate never changes tables
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    async:
      request-timeout: 1800000  # 30 min for live-update streams
  jackson:
    default-property-inclusion: always

app:
  jwt:
    # Must be 32+ characters. Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    # Comma separated. Wildcards allowed, e.g. https://*.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-demo: ${SEED_DEMO:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.issuetracker: INFO
