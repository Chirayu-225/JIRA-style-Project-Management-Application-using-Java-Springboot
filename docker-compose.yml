# Run the whole stack locally with ONE command (Windows, Mac or Linux):
#   docker compose up --build
# Then open http://localhost:5173 and click "Explore the demo workspace".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issuetracker
      POSTGRES_USER: issuetracker
      POSTGRES_PASSWORD: issuetracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/issuetracker
      DB_USERNAME: issuetracker
      DB_PASSWORD: issuetracker
      JWT_SECRET: local-docker-secret-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
